name: Build Windows installer

on:
  push:
    tags: ["v*"]
    branches: ["main"]        # main への push でもビルドだけ行う（Release への添付はタグのときだけ）
    paths-ignore: ["docs/**", "README.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            suffix: ""
          - arch: arm64
            runner: windows-11-arm     # Snapdragon X などのネイティブ ARM64 版（公開リポジトリは無料）
            suffix: "-arm64"
    steps:
      - uses: actions/checkout@v4

      - name: Clone NDL古典籍OCR-Lite (CC BY 4.0, NDL)
        run: git clone --depth 1 https://github.com/ndl-lab/ndlkotenocr-lite vendor/ndlkotenocr-lite

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          python -c "import platform, onnxruntime; print('python', platform.machine(), 'onnxruntime', onnxruntime.__version__)"

      - name: Run tests
        run: python -m pytest -q tests

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V=$(python -c "import kobun; print(kobun.__version__)"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          PYV=$(python -c "import kobun; print(kobun.__version__)")
          if [[ "${GITHUB_REF}" == refs/tags/v* && "$V" != "$PYV" ]]; then echo "タグ v$V と kobun/__init__.py の __version__ ($PYV) が一致しません"; exit 1; fi

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/komonjo.spec

      - name: Smoke test (frozen app starts and answers)
        shell: pwsh
        run: |
          $env:KOBUN_PORT = "5077"
          $env:KOBUN_CONFIG_DIR = "$env:RUNNER_TEMP\cfg"
          $env:KOBUN_DATA_DIR = "$env:RUNNER_TEMP\data"
          $p = Start-Process -FilePath dist\Komonjo-Daro\Komonjo-Daro.exe -PassThru
          $ok = $false
          foreach ($i in 1..60) { try { $r = Invoke-WebRequest http://127.0.0.1:5077/ -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep -Seconds 1 } }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "frozen app did not respond" }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup が無いのでインストールします"
            Invoke-WebRequest https://jrsoftware.org/download.php/is.exe -OutFile "$env:RUNNER_TEMP\is.exe"
            Start-Process -FilePath "$env:RUNNER_TEMP\is.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/ALLUSERS" -Wait
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe が見つかりません" }
          & $iscc | Select-Object -First 1

      - name: Inno Setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DArch=${{ matrix.arch }}" packaging\installer.iss
          Copy-Item "dist\installer\Komonjo-Daro-Setup${{ matrix.suffix }}.exe" "dist\installer\Komonjo-Daro-Setup-v${{ steps.ver.outputs.version }}${{ matrix.suffix }}.exe"
          Get-ChildItem dist\installer

      - uses: actions/upload-artifact@v4
        with:
          name: Komonjo-Daro-Setup-${{ matrix.arch }}
          path: dist/installer/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Komonjo-Daro-Setup-*
          merge-multiple: true
          path: installers
      - run: ls -la installers
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*.exe
          generate_release_notes: true
